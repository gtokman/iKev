# Regenerate KevDungeon.xcodeproj with `xcodegen` (brew install xcodegen) after editing this file.
name: KevDungeon
options:
  bundleIdPrefix: com.gtokman.kev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Kev:
    path: ../..
targets:
  KevDungeon:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Kev
        product: KevDungeonGame
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: KevDungeon.entitlements
      properties:
        # 4-bit Kev-0.8B needs ~0.65 GB resident; the default per-app limit is tight on older phones.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtokman.kev.dungeon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NTP2A7PJM8
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
